name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails the build on a high or critical advisory in anything that ships to production.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      # The committed widget copy is third-party-style vanilla JS, so only the app code is linted here.
      - run: npx eslint app components lib proxy.ts

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-chatbot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: portfolio-chatbot-backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - name: Tests
        env:
          # Dummy values: the tests never reach a real service.
          PINECONE_API_KEY: test
          GEMINI_API_KEY: test
          GROQ_API_KEY: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test
          SYNC_WEBHOOK_SECRET: test
        run: python -m unittest discover -s tests

  widget-copies-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The chat widget exists in two places and must stay identical
        run: |
          diff portfolio-chatbot-backend/widget/chatbot-widget.js frontend/public/widget/chatbot-widget.js
          diff portfolio-chatbot-backend/widget/chatbot-widget.css frontend/public/widget/chatbot-widget.css
