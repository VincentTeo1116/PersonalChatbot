name: Chatbot keep-awake

# The chatbot backend's free hosting plan puts it to sleep after about 15 minutes without traffic, and the next visitor then
# waits up to a minute for the first reply. This asks its health check every 10 minutes so it stays awake.
# GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days without a commit to this repository
# (re-enable under Actions when that happens). If the ping is ever late, the chat widget still tells the visitor
# that the assistant is waking up, so nothing breaks: the reply is just slower.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: chatbot-keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Set the repository variable CHATBOT_HEALTH_URL to change this without editing the file.
      HEALTH_URL: ${{ vars.CHATBOT_HEALTH_URL || 'https://portfolio-chatbot-backend-it6j.onrender.com/health' }}
    steps:
      - name: Ask the health check
        run: |
          # A sleeping service can take about a minute to answer, so allow that and try again once before failing.
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 75 "$HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP ${status:-none}"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::The chatbot backend did not answer its health check."
          exit 1
